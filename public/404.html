<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TechBitsVSK — Sravan Vadaga</title>
  <meta name="robots" content="noindex">
  <script>
    /* GitHub Pages serves this file for any path it does not
       recognise, which for a single-page app means every route
       except "/". It encodes the requested path into a query
       string and bounces to the root, where index.html puts it
       back. Without this, loading /about directly 404s.

       This is the rafgraph/spa-github-pages technique. The site
       is a user page served from the domain root, so no path
       segments are preserved. */
    var pathSegmentsToKeep = 0;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
