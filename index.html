  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <script>
    /* Counterpart to public/404.html: turns the encoded path in
       "/?/about" back into a real URL before the app boots, so
       React Router sees /about and the address bar looks right. */
    (function () {
      var l = window.location;
      if (l.search.charAt(1) !== '/') return;
      var decoded = l.search.slice(1).split('&').map(function (part) {
        return part.replace(/~and~/g, '&');
      }).join('?');
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    })();
  </script>

  <!-- Fonts: preconnect first so the font fetch starts in parallel
       rather than waiting on the stylesheet (was a CSS @import). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
  >
</head>

</body>
